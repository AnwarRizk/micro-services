global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: service-a
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: outbox-relay
    static_configs:
      - targets: ['host.docker.internal:9101']
