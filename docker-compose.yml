services:
  # ---------- Data store ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anwar
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sumdb
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount a SQL script to initialize the database with the outbox table
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anwar -d sumdb']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Kafka broker (KRaft mode: no separate Zookeeper needed) ----------
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: '0'
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: PLAINTEXT for other containers on the docker network,
      # CONTROLLER for Kafka's internal KRaft metadata traffic,
      # EXTERNAL for processes running directly on your host machine
      # (which is what service-a and service-b do today).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Kafka's internal topics (like __consumer_offsets, used by consumer
      # groups) default to needing 3 replicas, since real clusters usually
      # have at least 3 brokers. We only have 1 broker here, so these must
      # be set to 1 or the consumer group coordinator can never start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Any fixed-format string works for single-node local dev; it just
      # identifies this KRaft cluster's on-disk metadata format.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - '9094:9094' # for service-a / service-b running on your host machine

  # ---------- Web UI for inspecting topics, messages, consumer groups ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '8080:8080'

volumes:
  pgdata:

# NOTE: service-a and service-b are not containerized yet — run them
# directly on your host (npm start / uvicorn) for now. They'll be added
# here once each has a Dockerfile.
