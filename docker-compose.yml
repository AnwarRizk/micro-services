services:
  # ---------- Data store ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anwar
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sumdb
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount a SQL script to initialize the database with the outbox table
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anwar -d sumdb']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Kafka broker (KRaft mode: no separate Zookeeper needed) ----------
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: '0'
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: PLAINTEXT for other containers on the docker network,
      # CONTROLLER for Kafka's internal KRaft metadata traffic,
      # EXTERNAL for processes running directly on your host machine
      # (which is what service-a and service-b do today).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Kafka's internal topics (like __consumer_offsets, used by consumer
      # groups) default to needing 3 replicas, since real clusters usually
      # have at least 3 brokers. We only have 1 broker here, so these must
      # be set to 1 or the consumer group coordinator can never start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Any fixed-format string works for single-node local dev; it just
      # identifies this KRaft cluster's on-disk metadata format.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - '9094:9094' # for service-a / service-b running on your host machine
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Web UI for inspecting topics, messages, consumer groups ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '8080:8080'

  # ---------- Monitoring ----------
  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  # --------- Service A ---------
  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      GRPC_PORT: '50051'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: sumdb
      POSTGRES_USER: anwar
      POSTGRES_PASSWORD: '1234'
    ports:
      - '50051:50051'
      - '9100:9100'

  # --------- Outbox Relay ---------
  outbox-relay:
    build: ./outbox-relay
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: sumdb
      POSTGRES_USER: anwar
      POSTGRES_PASSWORD: '1234'
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: number-added
    ports:
      - '9101:9101'

  # --------- Service B ---------
  service-b:
    build: ./service-b
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: number-added
      KAFKA_GROUP_ID: service-b-group
      SUM_FILE_PATH: /data/sum_state.json
    ports:
      - '8000:8000'
    volumes:
      - sumdata:/data

volumes:
  pgdata:
  grafana-data:
  sumdata:
